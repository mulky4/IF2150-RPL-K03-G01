services:
  postgres:
    image: postgres:15-alpine
    container_name: rekanbumi-db
    restart: always
    environment:
      POSTGRES_USER: rekanbumi
      POSTGRES_PASSWORD: rekanbumi
      POSTGRES_DB: rekanbumi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
